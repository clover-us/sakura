<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    方案 D「窗沿探头的小生物」：**不指向具体物种** —— 圆脑袋 + 两只耳朵就能读成"小宠物"，
    趴在任务栏（桌面）上探出半个身子，直接表达"桌宠"这件事本身。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FE6DC"/>
      <stop offset="1" stop-color="#39A9C9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.18" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0.1" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6F4F6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F6F8"/>
    </linearGradient>
    <filter id="barShadow" x="-30%" y="-60%" width="160%" height="260%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F4A57" flood-opacity="0.24"/>
    </filter>
    <filter id="petShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0F4A57" flood-opacity="0.26"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#glow)"/>

  <!-- 任务栏（压薄一点，把画面让给宠物；小尺寸才看得出"头 + 耳朵"） -->
  <g filter="url(#barShadow)">
    <rect x="118" y="664" width="788" height="138" rx="48" fill="url(#bar)"/>
    <circle cx="238" cy="734" r="15" fill="#9BE0D8"/>
    <circle cx="296" cy="734" r="15" fill="#FFD9A8"/>
    <circle cx="354" cy="734" r="15" fill="#BBD7FF"/>
  </g>

  <!-- 小生物：两只立起来的耳朵（"这是个宠物"的关键特征）+ 圆脑袋 + 搭在栏沿的前爪 -->
  <g filter="url(#petShadow)">
    <path d="M330 336c18-96 84-120 116-52l30 78Z" fill="url(#skin)"/>
    <path d="M694 336c-18-96-84-120-116-52l-30 78Z" fill="url(#skin)"/>
    <ellipse cx="348" cy="632" rx="84" ry="44" fill="url(#skin)" transform="rotate(-14 348 632)"/>
    <ellipse cx="676" cy="632" rx="84" ry="44" fill="url(#skin)" transform="rotate(14 676 632)"/>
    <path d="M512 268c150 0 238 108 238 204 0 102-102 156-238 156S274 574 274 472c0-96 88-204 238-204Z" fill="url(#skin)"/>
    <ellipse cx="512" cy="536" rx="180" ry="74" fill="#FFFFFF" opacity="0.55"/>
    <ellipse cx="440" cy="452" rx="33" ry="37" fill="#22384A"/>
    <ellipse cx="584" cy="452" rx="33" ry="37" fill="#22384A"/>
    <circle cx="429" cy="438" r="12" fill="#FFFFFF"/>
    <circle cx="573" cy="438" r="12" fill="#FFFFFF"/>
    <ellipse cx="368" cy="528" rx="41" ry="24" fill="#FF9EC0" opacity="0.9"/>
    <ellipse cx="656" cy="528" rx="41" ry="24" fill="#FF9EC0" opacity="0.9"/>
    <path d="M476 532c14 24 58 24 72 0" fill="none" stroke="#22384A" stroke-width="15" stroke-linecap="round"/>
  </g>
</svg>
