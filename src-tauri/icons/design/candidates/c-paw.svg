<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    方案 C「爪印 + 窗口」：用符号说话 —— 窗口代表"桌面"，爪印代表"宠物"。
    几何形状简单、对比强，16px 下最不容易糊；缺点是偏"通用宠物"，不像具体角色。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE0C7"/>
      <stop offset="1" stop-color="#FFB0A0"/>
    </linearGradient>
    <linearGradient id="paw" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFA9C8"/>
      <stop offset="1" stop-color="#F8749F"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#8A3B2B" flood-opacity="0.2"/>
    </filter>
    <filter id="pawShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#8A3B2B" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <g filter="url(#cardShadow)">
    <rect x="182" y="206" width="660" height="612" rx="56" fill="#FFFFFF" opacity="0.97"/>
    <circle cx="248" cy="266" r="15" fill="#FFB3A0"/>
    <circle cx="298" cy="266" r="15" fill="#FFD9A8"/>
    <circle cx="348" cy="266" r="15" fill="#B9E3C6"/>
    <rect x="182" y="318" width="660" height="6" fill="#F1ECE9"/>
  </g>

  <!-- 爪印：四个脚趾 + 掌垫 -->
  <g filter="url(#pawShadow)" fill="url(#paw)">
    <ellipse cx="404" cy="470" rx="58" ry="66"/>
    <ellipse cx="512" cy="434" rx="58" ry="70"/>
    <ellipse cx="620" cy="470" rx="58" ry="66"/>
    <ellipse cx="690" cy="566" rx="52" ry="60"/>
    <path d="M512 512c88 0 158 62 158 132 0 62-58 96-158 96s-158-34-158-96c0-70 70-132 158-132Z"/>
  </g>
</svg>
