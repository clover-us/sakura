<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    方案 E「爪印」：宠物的通用符号，不指向任何物种。
    大色块 + 单一形状，**16px 下最不容易糊**（代价是表达不出"在桌面上"这层意思）。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFCF8A"/>
      <stop offset="1" stop-color="#FF8F6B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paw" x1="0.2" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF0E6"/>
    </linearGradient>
    <filter id="pawShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#8A3B1F" flood-opacity="0.26"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#glow)"/>

  <!-- 爪印：四个脚趾 + 掌垫，整体居中、留白均匀 -->
  <g filter="url(#pawShadow)" fill="url(#paw)">
    <ellipse cx="356" cy="404" rx="76" ry="86"/>
    <ellipse cx="512" cy="352" rx="76" ry="92"/>
    <ellipse cx="668" cy="404" rx="76" ry="86"/>
    <ellipse cx="772" cy="536" rx="68" ry="78"/>
    <path d="M512 470c118 0 210 84 210 176 0 82-78 128-210 128s-210-46-210-128c0-92 92-176 210-176Z"/>
  </g>
</svg>
