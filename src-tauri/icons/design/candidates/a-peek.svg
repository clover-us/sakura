<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    方案 A「趴在任务栏上」：一条白色任务栏 + 从栏后探出半个身子的宠物 + 搭在栏沿的两只鳍。
    比第一版干净得多（去掉了窗口卡片里的文字行）：小尺寸下只剩"一条横杠 + 一个头"，仍然读得出来。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD6E6"/>
      <stop offset="1" stop-color="#FF9FC2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.18" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0.1" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EEFF"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F6FB"/>
    </linearGradient>
    <filter id="barShadow" x="-30%" y="-60%" width="160%" height="260%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#7E2A4C" flood-opacity="0.22"/>
    </filter>
    <filter id="petShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#7E2A4C" flood-opacity="0.26"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#glow)"/>

  <!-- 任务栏 -->
  <g filter="url(#barShadow)">
    <rect x="118" y="612" width="788" height="168" rx="56" fill="url(#bar)"/>
    <circle cx="236" cy="696" r="18" fill="#FFC3DA"/>
    <circle cx="300" cy="696" r="18" fill="#FFE0B8"/>
    <circle cx="364" cy="696" r="18" fill="#C6E7D2"/>
    <rect x="640" y="678" width="200" height="36" rx="18" fill="#EFF1F7"/>
  </g>

  <!-- 宠物：头 + 搭在栏沿的两只鳍 -->
  <g filter="url(#petShadow)">
    <ellipse cx="330" cy="596" rx="92" ry="50" fill="url(#skin)" transform="rotate(-16 330 596)"/>
    <ellipse cx="694" cy="596" rx="92" ry="50" fill="url(#skin)" transform="rotate(16 694 596)"/>
    <path d="M512 250c150 0 244 108 244 214 0 104-104 158-244 158S268 568 268 464c0-106 94-214 244-214Z" fill="url(#skin)"/>
    <ellipse cx="512" cy="530" rx="184" ry="76" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="512" cy="212" r="22" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="466" cy="168" r="15" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="556" cy="162" r="12" fill="#FFFFFF" opacity="0.68"/>
    <ellipse cx="446" cy="444" rx="32" ry="36" fill="#25304C"/>
    <ellipse cx="586" cy="444" rx="32" ry="36" fill="#25304C"/>
    <circle cx="435" cy="430" r="12" fill="#FFFFFF"/>
    <circle cx="575" cy="430" r="12" fill="#FFFFFF"/>
    <ellipse cx="374" cy="520" rx="40" ry="24" fill="#FF9EC0" opacity="0.9"/>
    <ellipse cx="652" cy="520" rx="40" ry="24" fill="#FF9EC0" opacity="0.9"/>
    <path d="M478 522c14 24 62 24 76 0" fill="none" stroke="#25304C" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
