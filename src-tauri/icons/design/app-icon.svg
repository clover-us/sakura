<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    方案 B「大脸」：把宠物画成表情包式的正面形象 —— 小尺寸下最容易认出"这是个活物"。
    蓝紫渐变底 + 白色小鲸鱼（含胸鳍/腮红/水柱）；纯角色，不掺窗口等叙事元素。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BB9FF"/>
      <stop offset="1" stop-color="#6C79EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0.1" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE7FB"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1C2559" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#glow)"/>

  <g filter="url(#soft)">
    <!-- 尾叶：两片横向宽叶 + 中间收窄的尾柄（鲸尾的判据；两叶之间留缺口形成中缝） -->
    <ellipse cx="796" cy="486" rx="140" ry="54" fill="url(#skin)" transform="rotate(-19 796 486)"/>
    <ellipse cx="804" cy="614" rx="140" ry="54" fill="url(#skin)" transform="rotate(19 804 614)"/>
    <ellipse cx="690" cy="550" rx="96" ry="58" fill="url(#skin)"/>

    <!-- 头身一体 -->
    <path d="M452 300c170 0 266 116 266 226 0 124-120 194-266 194S186 650 186 526c0-110 96-226 266-226Z" fill="url(#skin)"/>
    <!-- 腹部高光（给一点体积感，别是一块死白） -->
    <ellipse cx="452" cy="626" rx="196" ry="86" fill="#FFFFFF" opacity="0.55"/>

    <!-- 胸鳍 -->
    <ellipse cx="332" cy="676" rx="86" ry="46" fill="url(#skin)" transform="rotate(24 332 676)"/>

    <!-- 头顶水柱：三点由小到大，暗示"喷气" -->
    <circle cx="452" cy="252" r="24" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="404" cy="204" r="16" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="500" cy="196" r="13" fill="#FFFFFF" opacity="0.68"/>

    <!-- 眼睛 + 高光（16px 下就靠这两个点认脸） -->
    <ellipse cx="374" cy="512" rx="36" ry="40" fill="#1F2947"/>
    <ellipse cx="536" cy="512" rx="36" ry="40" fill="#1F2947"/>
    <circle cx="362" cy="496" r="13" fill="#FFFFFF"/>
    <circle cx="524" cy="496" r="13" fill="#FFFFFF"/>

    <!-- 腮红 + 微笑 -->
    <ellipse cx="296" cy="596" rx="44" ry="27" fill="#FF9EC0" opacity="0.92"/>
    <ellipse cx="614" cy="596" rx="44" ry="27" fill="#FF9EC0" opacity="0.92"/>
    <path d="M414 602c16 26 70 26 86 0" fill="none" stroke="#1F2947" stroke-width="17" stroke-linecap="round"/>
  </g>
</svg>
