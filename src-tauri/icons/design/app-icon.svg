<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    方案 D「窗沿探头的小生物」：**不指向具体物种** —— 圆脑袋 + 两只小耳朵就能读成"小宠物"，
    趴在任务栏（桌面）上探出半个身子，直接表达"桌宠"这件事本身。

    ★ 这一版是**用户选定**的样子（2026-09-19）：耳朵圆一点、任务栏厚一点。
      另有一版把耳朵立高、横条压薄（`g-pet-peek-tall-ears.svg`），16px 下更清楚，
      但那不是用户点头的那张图，故只作备选。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FE6DC"/>
      <stop offset="1" stop-color="#39A9C9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.18" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0.1" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6F4F6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F6F8"/>
    </linearGradient>
    <filter id="barShadow" x="-30%" y="-60%" width="160%" height="260%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F4A57" flood-opacity="0.24"/>
    </filter>
    <filter id="petShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0F4A57" flood-opacity="0.26"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#glow)"/>

  <!-- 任务栏 -->
  <g filter="url(#barShadow)">
    <rect x="118" y="622" width="788" height="164" rx="54" fill="url(#bar)"/>
    <circle cx="238" cy="704" r="17" fill="#9BE0D8"/>
    <circle cx="300" cy="704" r="17" fill="#FFD9A8"/>
    <circle cx="362" cy="704" r="17" fill="#BBD7FF"/>
  </g>

  <!-- 小生物：耳朵 + 圆脑袋 + 搭在栏沿的两只前爪 -->
  <g filter="url(#petShadow)">
    <path d="M352 372c26-88 78-104 104-56l34 66Z" fill="url(#skin)"/>
    <path d="M672 372c-26-88-78-104-104-56l-34 66Z" fill="url(#skin)"/>
    <ellipse cx="342" cy="606" rx="86" ry="46" fill="url(#skin)" transform="rotate(-14 342 606)"/>
    <ellipse cx="682" cy="606" rx="86" ry="46" fill="url(#skin)" transform="rotate(14 682 606)"/>
    <path d="M512 262c158 0 250 112 250 212 0 106-108 162-250 162S262 580 262 474c0-100 92-212 250-212Z" fill="url(#skin)"/>
    <ellipse cx="512" cy="540" rx="188" ry="78" fill="#FFFFFF" opacity="0.55"/>
    <ellipse cx="440" cy="452" rx="34" ry="38" fill="#22384A"/>
    <ellipse cx="584" cy="452" rx="34" ry="38" fill="#22384A"/>
    <circle cx="428" cy="437" r="13" fill="#FFFFFF"/>
    <circle cx="572" cy="437" r="13" fill="#FFFFFF"/>
    <ellipse cx="366" cy="530" rx="42" ry="25" fill="#FF9EC0" opacity="0.9"/>
    <ellipse cx="658" cy="530" rx="42" ry="25" fill="#FF9EC0" opacity="0.9"/>
    <path d="M474 534c14 24 62 24 76 0" fill="none" stroke="#22384A" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
